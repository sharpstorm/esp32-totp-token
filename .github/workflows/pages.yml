name: Publish companion to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; don't cancel one that's already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion/web/package-lock.json

      - run: npm ci

      # public/ isn't committed: build the single-file page (with fresh CSP
      # hashes) from src/ with esbuild.
      - run: npm run build

      # Publish only the page itself. GitHub Pages ignores _headers; the CSP is
      # enforced by the <meta> tag inside index.html.
      - name: Assemble site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp public/index.html "$RUNNER_TEMP/site/index.html"
          touch "$RUNNER_TEMP/site/.nojekyll"
          ls -la "$RUNNER_TEMP/site"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
